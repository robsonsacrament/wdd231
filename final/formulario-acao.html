<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Corrida & Vida - Inscrição Confirmada</title>
    <meta name="description" content="Confirmação de inscrição na newsletter Corrida & Vida. Veja seus dados.">
    <meta name="author" content="Robson Sacramento Beserra">

    <!-- Open Graph / Redes Sociais -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Corrida & Vida">
    <meta property="og:title" content="Corrida & Vida - Inscrição Confirmada">
    <meta property="og:description" content="Obrigado por se inscrever na newsletter do Corrida & Vida.">
    <meta property="og:url" content="https://robsonsacrament.github.io/wdd231/final/formulario-acao.html">
    <meta property="og:image" content="https://robsonsacrament.github.io/wdd231/final/imagens/hero.webp">
    <meta property="og:image:alt" content="Inscrição confirmada - Corrida & Vida">
    <meta property="og:locale" content="pt_BR">

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Corrida & Vida - Inscrição Confirmada">
    <meta name="twitter:description" content="Obrigado por se inscrever na newsletter do Corrida & Vida.">
    <meta name="twitter:image" content="https://robsonsacrament.github.io/wdd231/final/imagens/hero.webp">

    <!-- Favicon -->
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
    <link rel="manifest" href="site.webmanifest">
    <link rel="icon" href="favicon.ico" type="image/x-icon">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Merriweather:wght@400;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="estilos/style.css">
</head>
<body>

    <header>
        <div class="logo">
            <span>🏃</span>
            <p class="logo-nome">Corrida & Vida</p>
        </div>
        <nav>
            <a href="index.html">Início</a>
            <a href="treinos.html">Treinos</a>
            <a href="contato.html">Contato</a>
            <a href="referencias.html">Referências</a>
        </nav>
        <button id="menu-hamburger" aria-expanded="false" aria-label="Abrir menu">☰</button>
    </header>

    <main>
        <h1>✅ Inscrição Confirmada!</h1>
        <p class="sucesso-msg">Obrigado por se inscrever na newsletter do Corrida & Vida. Abaixo estão os dados que você enviou:</p>

        <section class="dados-recebidos" aria-labelledby="titulo-dados">
            <h2 id="titulo-dados">Seus dados</h2>
            <dl id="dados-form">
                <!-- Preenchido dinamicamente via JavaScript -->
            </dl>
        </section>

        <p class="voltar-container">
            <a href="index.html" class="btn">Voltar ao início</a>
        </p>
    </main>

    <footer>
        <p>&copy; <span id="ano"></span> Corrida & Vida - Robson Sacramento Beserra</p>
        <p id="modificacao"></p>
        <p><a href="referencias.html">Referências</a></p>
    </footer>

    <script>
        // ============================================
        // Lê os parâmetros da URL (form method="get")
        // e exibe os dados do formulário
        // ============================================
        const params = new URLSearchParams(window.location.search);

        // Mapeia os campos do formulário para labels amigáveis
        const campos = [
            { chave: 'nome',     label: 'Nome completo' },
            { chave: 'email',    label: 'E-mail' },
            { chave: 'nivel',    label: 'Nível atual' },
            { chave: 'objetivo', label: 'Objetivo principal' },
            { chave: 'termos',   label: 'Aceitou receber e-mails' }
        ];

        // Monta o <dl> com os dados recebidos (template literals)
        const dl = document.getElementById('dados-form');

        dl.innerHTML = campos.map(campo => {
            let valor = params.get(campo.chave);

            // Tratamento especial para campos vazios ou checkbox
            if (campo.chave === 'termos') {
                valor = valor ? 'Sim' : 'Não';
            } else if (!valor || valor.trim() === '') {
                valor = '(não informado)';
            }

            return `
                <dt>${campo.label}</dt>
                <dd>${valor}</dd>
            `;
        }).join('');

        // ============================================
        // Rodapé - Ano atual
        // ============================================
        document.getElementById('ano').textContent = new Date().getFullYear();

        // ============================================
        // Rodapé - Data de modificação
        // ============================================
        const d = new Date(document.lastModified);
        const pad = (n) => String(n).padStart(2, '0');

        document.getElementById('modificacao').textContent =
            `Última modificação: ${pad(d.getDate())}/${pad(d.getMonth() + 1)}/${d.getFullYear()} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
    </script>

</body>
</html>
